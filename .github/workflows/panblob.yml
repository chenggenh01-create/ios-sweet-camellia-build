name: panblob

# Compiles a compute kernel to Mali Valhall (v9, G57) machine code with Mesa's
# panfrost compiler, on Linux, and uploads the blob.  The XNU kernel embeds that
# blob and submits it as a compute job (see xnu.yml).
#
# Target device: Redmi Note 10 5G, MT6833 (Dimensity 700), Mali-G57 MC2,
# GPU_ID 0x90930010 -> Valhall v9.  Not Bifrost, not Adreno.
#
# The pipeline mirrors what Mesa itself does for panvk's precompiled kernels:
# OpenCL C --mesa_clc--> library SPIR-V (Linkage, no OpEntryPoint)
#           --panfrost_compile--> Valhall ISA + shader info.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/panblob.yml'
      - 'ci/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3-pip python3-venv python3-mako python3-yaml \
            python3-ply pkg-config bison flex zlib1g-dev libzstd-dev \
            libexpat1-dev libudev-dev libelf-dev cmake \
            libdrm-dev libwayland-dev wayland-protocols \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-sync-dev libxcb-shm0-dev \
            libxcb-glx0-dev libxext-dev libxrandr-dev libxxf86vm-dev \
            libxshmfence-dev spirv-tools \
            llvm-18-dev libclang-18-dev libclang-cpp18-dev \
            libllvmspirvlib-18-dev clang-18
          python3 -m venv ~/venv
          ~/venv/bin/pip install -q --upgrade pip
          ~/venv/bin/pip install -q "meson>=1.5" ninja "mako>=0.8" packaging pyyaml ply setuptools
          echo "$HOME/venv/bin" >> $GITHUB_PATH
          ~/venv/bin/meson --version && ~/venv/bin/ninja --version
          cargo install --quiet bindgen-cli
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          bindgen --version

      # Ubuntu 24.04 ships libdrm 2.4.125 and Mesa 26.3 wants >= 2.4.133.
      - name: Build libdrm (pinned)
        run: |
          git clone --depth 1 --branch libdrm-2.4.134 \
            https://gitlab.freedesktop.org/mesa/libdrm.git libdrm
          cd libdrm
          ~/venv/bin/meson setup build -Dtests=false -Dman-pages=disabled \
            -Dvalgrind=disabled -Dudev=true
          ~/venv/bin/ninja -C build
          sudo ~/venv/bin/ninja -C build install
          echo "PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          pkg-config --modversion libdrm

      - name: Fetch Mesa (pinned)
        run: |
          git clone --depth 1 --branch mesa-26.3.1 \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa
          cd mesa && git log -1 --oneline

      # with_clc (Mesa's in-tree OpenCL compiler, used by mesa_clc) is on because
      # the panfrost tools enable it; that needs LLVMSPIRVLib, which is installed
      # above.  softpipe keeps with_gfx_compute true so NIR is built for real.
      - name: Configure
        run: |
          cd mesa
          meson setup build \
            -Dtools=panfrost \
            -Dprecomp-compiler=enabled \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true \
            -Dpanfrost-rust=false \
            -Dbuild-tests=false \
            -Dgallium-drivers=softpipe \
            -Dvulkan-drivers= \
            -Dglx=disabled -Degl=disabled -Dgles1=disabled -Dgles2=disabled \
            -Dplatforms=x11 -Dvideo-codecs= \
            -Dzstd=disabled \
            2>&1 | tail -25

      - name: Build mesa_clc and panfrost_compile
        run: |
          mkdir -p diag
          cd mesa
          ninja -C build src/compiler/clc/mesa_clc src/panfrost/clc/panfrost_compile \
            2>&1 | tee ../diag/ninja.txt | tail -25
          ls -l build/src/compiler/clc/mesa_clc build/src/panfrost/clc/panfrost_compile

      - name: Compile the copy kernel to v9 machine code
        run: |
          mkdir -p diag
          set -x
          cat > copy.cl <<'EOF'
          #include "compiler/libcl/libcl.h"

          KERNEL(64)
          panlib_copy(global const uint32_t *src, global uint32_t *dst, uint32_t n)
          {
             uint32_t i = cl_global_id.x;
             if (i < n)
                dst[i] = src[i];
          }
          EOF
          mesa/build/src/compiler/clc/mesa_clc -o copy.spv --depfile copy.d copy.cl -- \
            -DPAN_ARCH=9 \
            -Imesa/include -Imesa/src -Imesa/src/compiler/libcl \
            -cl-std=cl2.0 -D__OPENCL_VERSION__=200 \
            -DHAVE___BUILTIN_FFS -DHAVE___BUILTIN_CLZ -DNDEBUG \
            2>&1 | tee diag/mesa_clc.txt
          ls -l copy.spv
          spirv-dis copy.spv > diag/copy.spv.txt 2>&1 || true
          grep -E 'OpCapability|OpEntryPoint|LinkageAttributes' diag/copy.spv.txt | head -20 || true
          mesa/build/src/panfrost/clc/panfrost_compile panlib_shaders 9 copy.spv copy.h copy.c \
            2>&1 | tee diag/panfrost_compile.txt
          echo "panfrost_compile exit=$?" | tee -a diag/panfrost_compile.txt
          wc -c copy.h copy.c
          head -30 copy.h || true

      - name: Disassemble the generated ISA
        if: always()
        run: |
          python3 - <<'PY'
          import re
          txt = open('copy.c', encoding='utf-8').read()
          m = re.search(r'panlib_copy_0_default\[(\d+)\] = \{(.*?)\};', txt, re.S)
          if not m:
              raise SystemExit('array not found')
          words = re.findall(r'0x[0-9a-fA-F]+', m.group(2))
          with open('copy_isa.bin', 'wb') as f:
              for w in words:
                  f.write(int(w, 16).to_bytes(4, 'little'))
          print('isa words', len(words))
          PY
          ls -l copy_isa.bin || true
          ninja -C mesa/build src/panfrost/compiler/bifrost/bifrost_compiler 2>&1 | tail -3 || true
          TOOL=$(find mesa/build -type f -perm -u+x -name 'bifrost_compiler' | head -1)
          echo "disassembler: $TOOL"
          if [ -n "$TOOL" ] && [ -f copy_isa.bin ]; then
            "$TOOL" --gpu G57 copy_isa.bin > diag/isa_disasm.txt 2>&1 || \
            "$TOOL" -g G57 copy_isa.bin > diag/isa_disasm.txt 2>&1 || true
            head -40 diag/isa_disasm.txt
          fi

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diag
          if [ -f mesa/build/meson-logs/meson-log.txt ]; then
            tail -80 mesa/build/meson-logs/meson-log.txt > diag/meson-log-tail.txt
          fi
          wc -c diag/* || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mali-v9-copy-blob
          path: |
            copy.spv
            copy.h
            copy_isa.bin
            copy.c
            copy.d
            diag/
          if-no-files-found: warn
