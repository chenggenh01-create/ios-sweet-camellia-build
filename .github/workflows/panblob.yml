name: panblob

# Compiles a compute kernel to Mali Valhall (v9, G57) machine code with Mesa's
# panfrost compiler, on Linux, and uploads the resulting blob.  The XNU kernel
# then embeds that blob and submits it as a compute job (see xnu.yml).
#
# Target device: Redmi Note 10 5G, MT6833 (Dimensity 700), Mali-G57 MC2,
# GPU_ID 0x90930010 -> Valhall v9.  Not Bifrost, not Adreno.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/panblob.yml'
      - 'ci/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3-pip python3-venv python3-mako python3-yaml \
            python3-ply libdrm-dev pkg-config bison flex zlib1g-dev \
            libzstd-dev libexpat1-dev libudev-dev libelf-dev cmake clang \
            glslang-tools spirv-tools \
            libwayland-dev wayland-protocols \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-sync-dev libxcb-shm0-dev \
            libxcb-glx0-dev libxext-dev libxrandr-dev libxxf86vm-dev \
            libxshmfence-dev libdrm-dev
          python3 -m venv ~/venv
          ~/venv/bin/pip install -q --upgrade pip
          ~/venv/bin/pip install -q "meson>=1.5" ninja "mako>=0.8" packaging pyyaml ply setuptools
          echo "$HOME/venv/bin" >> $GITHUB_PATH
          ~/venv/bin/meson --version && ~/venv/bin/ninja --version
          # Mesa needs bindgen >= 0.71.1 and noble's package is 0.66, so build the
          # current one from crates.io and put it ahead of /usr/bin.
          cargo install --quiet bindgen-cli
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          bindgen --version

      # Ubuntu 24.04 ships libdrm 2.4.125 and Mesa 26.3 wants >= 2.4.133, so
      # build the released tag here and put its .pc files on the search path.
      - name: Build libdrm (pinned)
        run: |
          git clone --depth 1 --branch libdrm-2.4.134 \
            https://gitlab.freedesktop.org/mesa/libdrm.git libdrm
          cd libdrm
          ~/venv/bin/meson setup build -Dtests=false -Dman-pages=disabled \
            -Dvalgrind=disabled -Dudev=true
          ~/venv/bin/ninja -C build
          sudo ~/venv/bin/ninja -C build install
          echo "PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          pkg-config --modversion libdrm

      - name: Fetch Mesa (pinned)
        run: |
          git clone --depth 1 --branch mesa-26.3.1 \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa
          cd mesa && git log -1 --oneline

      # LLVMSPIRVLib (SPIRV-LLVM-Translator) is only needed by Mesa's OpenCL CLC
      # compiler, which this pipeline does not use; Ubuntu does not package it and
      # building it from source would have to match the LLVM version exactly.
      # Making the dependency optional lets the panfrost compiler build on its own.
      - name: Make LLVMSPIRVLib optional
        run: |
          cd mesa
          sed -i "s/dependency('LLVMSPIRVLib', required : true, version : _llvmspirvlib_version)/dependency('LLVMSPIRVLib', required : false)/" meson.build
          # Enabling the panfrost tools also turns on Mesa's OpenCL (CLC) build,
          # which drags in LLVM/clang libraries that have nothing to do with
          # shader compilation for the G57.  Force those branches off; only the
          # panfrost compiler is built here.
          sed -i "s/^if with_clc$/if false and with_clc/" meson.build
          grep -n "if false and with_clc" meson.build | head -5
          grep -n "LLVMSPIRVLib" meson.build | head -3

      - name: Configure
        run: |
          cd mesa
          meson setup build \
            -Dtools=panfrost \
            -Dpanfrost-rust=false \
            -Dbuild-tests=false \
            -Dgallium-drivers= \
            -Dglx=disabled -Degl=disabled -Dgles1=disabled -Dgles2=disabled \
            -Dplatforms=x11 -Dvideo-codecs= \
            -Dzstd=disabled \
            2>&1 | tail -20

      - name: Build panfrost_compile
        run: |
          mkdir -p diag
          cd mesa
          ninja -C build src/panfrost/clc/panfrost_compile 2>&1 | tee ../diag/ninja.txt | tail -30
          ls -l build/src/panfrost/clc/panfrost_compile
          ./build/src/panfrost/clc/panfrost_compile || true

      # The run log is ~6 MB and this network keeps dropping it, so keep the
      # failure reason in a few-KB artifact instead.
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diag
          if [ -f mesa/build/meson-logs/meson-log.txt ]; then
            tail -120 mesa/build/meson-logs/meson-log.txt > diag/meson-log-tail.txt
          fi
          grep -n -E "ERROR|error:" mesa/build/meson-logs/meson-log.txt 2>/dev/null | tail -30 > diag/errors.txt || true
          wc -c diag/* || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panblob-diag
          path: diag/
          if-no-files-found: warn

      - name: Compile a copy kernel to v9 machine code
        run: |
          set -x
          cat > copy.comp <<'EOF'
          #version 450
          layout(local_size_x = 64) in;
          layout(set = 0, binding = 0) buffer Src { uint src[]; };
          layout(set = 0, binding = 1) buffer Dst { uint dst[]; };
          void main()
          {
            uint i = gl_GlobalInvocationID.x;
            dst[i] = src[i];
          }
          EOF
          glslangValidator -V -S comp copy.comp -o copy.spv
          ls -l copy.spv
          mesa/build/src/panfrost/clc/panfrost_compile copy 9 copy.spv copy.h copy.c
          ls -l copy.h copy.c
          head -30 copy.h || true
          grep -c '0x' copy.c || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mali-v9-copy-blob
          path: |
            copy.spv
            copy.h
            copy.c
          if-no-files-found: warn
