name: xnu

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  UPSTREAM_REPO: https://github.com/dipa-studio/ios-sweet
  UPSTREAM_SHA: 45263bee51df4a0f55cdf9c649af886399488ddb
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: CAMELLIA

jobs:
  build:
    # macos-14 ships Xcode 15.x, whose iig matches the xnu-8796 IORPC ABI
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script and upstream patches
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # upstream ios-sweet carries 0001-0081 (SWEET bring-up); this repo only 0082+
          git init -q upstream
          git -C upstream fetch -q --depth 1 "$UPSTREAM_REPO" "$UPSTREAM_SHA"
          git -C upstream checkout -q FETCH_HEAD
          cp upstream/xnu/patches/*.patch upstream/xnu/patches/*.sh dxb/patches/
          cp xnu/patches/*.patch dxb/patches/
          # Upstream stage scripts bail out unless MACHINE_CONFIG is SWEET; the
          # camellia kernel needs the same staged sources (bearssl, hfs, pthread).
          sed -i '' 's/\[\[ "${MACHINE_CONFIG:-}" == SWEET \]\] || exit 0/[[ "${MACHINE_CONFIG:-}" == SWEET || "${MACHINE_CONFIG:-}" == CAMELLIA ]] || exit 0/' dxb/patches/*.sh
          grep -h 'MACHINE_CONFIG' dxb/patches/*.sh
          # libfirehose_kernel is built arm64e-only; this kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

          ls dxb/patches | wc -l
          ls dxb/patches | tail -8

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists; Xcode is preinstalled
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          ccache --version | head -1
          # ccache in masquerade mode: xcodebuild spawns CC as ONE path (no shell),
          # so "ccache clang" cannot work -- a directory of clang/clang++ symlinks
          # to ccache can.  ccache then finds the real clang by argv[0] on PATH,
          # which build.sh pins to the Xcode toolchain.
          mkdir -p "$HOME/ccache-bin"
          ln -sf "$(command -v ccache)" "$HOME/ccache-bin/clang"
          ln -sf "$(command -v ccache)" "$HOME/ccache-bin/clang++"
          sed -i '' "s|export CC=\"\$(xcrun -find clang)\"|export CC=\"$HOME/ccache-bin/clang\"|" dxb/build.sh
          sed -i '' "s|export CXX=\"\$(xcrun -find clang++)\"|export CXX=\"$HOME/ccache-bin/clang++\"|" dxb/build.sh
          grep -n 'export CC=\|export CXX=' dxb/build.sh
          "$HOME/ccache-bin/clang" --version | head -2
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=3G"
            echo "CCACHE_COMPRESS=true"
            # file_stat_matches: a re-applied patch changes mtimes but not
            # content, and ccache should still hit on those files.
            echo "CCACHE_SLOPPINESS=file_stat_matches,include_file_mtime,include_file_ctime"
          } >> "$GITHUB_ENV"

      # Content-addressed, so the key may change every run and the fallback
      # restore-keys still brings back a useful cache: hits are per object file,
      # not per tree (this is why the object tree itself is NOT cached -- that
      # would risk building a stale kernel when a patch fails to apply).
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('xnu/patches/*.patch') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee /tmp/build.log
          echo "build.sh exit=$?"

      # A failed XNU build used to mean downloading the 6 MB run log; keep the
      # error lines and the tail in a few-KB artifact instead.
      - name: Collect build diagnostics
        if: always()
        run: |
          mkdir -p dump
          if [ -f /tmp/build.log ]; then
            tail -120 /tmp/build.log > dump/build-tail.txt
            grep -n -E "error:|Error |FAILED|Skipping patch|Undefined symbols" /tmp/build.log | tail -80 > dump/build-errors.txt || true
          fi
          wc -c dump/* || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-diag
          path: dump/
          if-no-files-found: warn

      # Dump the presentation path out of the tree that was actually built, so a
      # patch against it is written against real context instead of a guess.
      # The same dump as a tiny artifact (a few KB), so it can be fetched without
      # downloading the 6 MB job log.
      - name: Dump present()
        if: always()
        run: |
          mkdir -p dump
          # Exact post-patch sources for files the GPU service patch has to edit;
          # the local worktree is an older snapshot, so the CI tree is the truth.
          for rel in iokit/Kernel/arm/SweetFramebuffer.cpp \
                     iokit/Kernel/arm/hid/SweetHID.cpp \
                     iokit/Kernel/IOUserClient.cpp \
                     iokit/Kernel/IOService.cpp \
                     iokit/conf/files.arm64; do
            src="dxb/xnu/$rel"
            if [ -f "$src" ]; then
              cp "$src" "dump/$(echo $rel | tr '/' '_')"
            fi
          done
          F=$(find dxb -path '*iokit/Kernel/arm/SweetFramebuffer.cpp' | head -1)
          echo "file: $F"
          if [ -n "$F" ]; then
            sed -n '/^AppleCLCD::present(/,/^}$/p' "$F" > dump/present.txt
          fi
          wc -l dump/present.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: present-txt
          path: dump/present.txt
          if-no-files-found: warn

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Collect kernel
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
